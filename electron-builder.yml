appId: com.riftcoach.app
productName: Rift Coach
copyright: Copyright © 2026 Rift Coach
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
npmRebuild: false
win:
  icon: build/icon.png
  executableName: RiftCoach
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  # one-click installer: double-click, it installs for the current user (no admin prompt) and starts the app
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Rift Coach
  uninstallDisplayName: Rift Coach
  deleteAppDataOnUninstall: false
  # fixed names give a permanent "latest release" download link
  artifactName: RiftCoach-Setup.${ext}
portable:
  artifactName: RiftCoach-Portable.${ext}
