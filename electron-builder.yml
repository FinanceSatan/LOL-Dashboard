appId: com.riftcoach.app
productName: Rift Coach
copyright: Copyright © 2026 Rift Coach
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
npmRebuild: false
win:
  icon: build/icon.png
  executableName: RiftCoach
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Rift Coach
  artifactName: Rift-Coach-Setup-${version}.${ext}
  uninstallDisplayName: Rift Coach
portable:
  artifactName: Rift-Coach-Portable-${version}.${ext}
