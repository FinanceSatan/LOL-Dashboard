name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (installed apps update to it automatically)
        type: boolean
        default: true
      bump:
        description: Raise the version before building (none = keep package.json version)
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.release && inputs.bump != 'none'
        run: npm version ${{ inputs.bump }} --no-git-tag-version
      - name: Refuse to re-release an existing version
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "::error::$v is already released. Run the workflow again with bump = patch/minor/major."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit version bump
        id: commit
        run: |
          if [ -n "$(git status --porcelain package.json package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release v$(node -p "require('./package.json').version")" package.json package-lock.json
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package installer and portable exe
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify auto-update files
        shell: bash
        run: |
          set -e
          cat release/*/win-unpacked/resources/app-update.yml
          cat release/*/latest.yml
          ls release/*/RiftCoach-Setup.exe.blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: Rift-Coach-Windows
          path: |
            release/*/RiftCoach-Setup.exe
            release/*/RiftCoach-Portable.exe
          if-no-files-found: error
      # Runs for pushed v* tags, or when started manually with "release" enabled (GitHub then creates the tag).
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ needs.check.outputs.sha }}
          name: Rift Coach v${{ needs.check.outputs.version }}
          body_path: .github/release-notes.md
          make_latest: 'true'
          fail_on_unmatched_files: true
          # latest.yml + blockmap are what installed apps read to update themselves
          files: |
            release/*/RiftCoach-Setup.exe
            release/*/RiftCoach-Setup.exe.blockmap
            release/*/latest.yml
            release/*/RiftCoach-Portable.exe
